# Render deployment.
#
# Every secret is marked sync:false, which means Render prompts for it rather
# than reading it from this file. None of them belong in a public repo, and two
# of them change what the service will DO if they go missing:
#
#   STRESSPROOF_PAY_TO      missing -> paid runs refuse with a 503.
#                           They do not silently become free. See paymentGate.js.
#   STRESSPROOF_SIGNER_...  missing -> reports go out unsigned rather than
#                           falsely signed. See attestation.js.
#   GROQ_API_KEY            missing -> reports carry no plain-English summary.
#                           The verdict is computed before the explainer runs
#                           and never reads its output, so nothing else changes.
#
# All three degrade loudly: /about reports which of them are configured, so a
# half-deployed service is visible from outside rather than only in the logs.

services:
  - type: web
    name: stressproof
    runtime: node
    # Free plan. It sleeps after 15 minutes with no traffic and takes about a
    # minute to wake, so the first request after a quiet spell is slow. That is
    # a property of the hosting, not of the service: a woken instance behaves
    # identically. Render also grants 750 free instance hours per WORKSPACE per
    # month and suspends every free service once they are gone, which is why
    # this is not pinged awake around the clock. Switch to `starter` for any
    # window where a cold start would be read as a broken product; billing is
    # prorated to the second, so that costs cents rather than a month.
    plan: free
    region: oregon
    branch: master
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2

      # --- payment ---------------------------------------------------------
      # The wallet that receives 0.25 USDC per certification run.
      - key: STRESSPROOF_PAY_TO
        sync: false
      # Leave unset for Base mainnet. Set to "sepolia" to fall back to testnet,
      # which flips network, token and EIP-712 domain together so a
      # half-switched state is not expressible.
      - key: STRESSPROOF_NETWORK
        sync: false
      # xpay (default) settles both Base mainnet and Base Sepolia.
      - key: STRESSPROOF_FACILITATOR
        value: xpay

      # --- signing ---------------------------------------------------------
      # Signs every report. The matching public address is published at /about
      # so anyone can verify a certificate without trusting this service.
      #
      # SET THIS ONE. Without it the service still runs and still certifies,
      # but every report goes out unsigned, and the permanent certificate link
      # then correctly answers "unsigned, so it cannot be checked", which is
      # the whole demo answering that it cannot demonstrate itself. It holds no
      # money and never signs a transaction, so it does not need a funded
      # wallet: any freshly generated private key will do.
      - key: STRESSPROOF_SIGNER_PRIVATE_KEY
        sync: false

      # --- explainer -------------------------------------------------------
      - key: GROQ_API_KEY
        sync: false

      # --- free demo -------------------------------------------------------
      # Comma-separated URL prefixes allowed on the free route, on top of our
      # own hosted demo agent. Only add a target whose owner has agreed.
      - key: STRESSPROOF_DEMO_ALLOWLIST
        sync: false
